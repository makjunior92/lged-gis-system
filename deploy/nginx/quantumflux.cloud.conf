# Host nginx site for quantumflux.cloud → Docker frontend at /lged/
# Install on VPS: deploy/scripts/setup-host-nginx.sh

server {
    listen 80;
    listen [::]:80;
    server_name quantumflux.cloud www.quantumflux.cloud;

    location = /lged {
        return 301 /lged/;
    }

    location /lged/ {
        proxy_pass http://127.0.0.1:3000/lged/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
