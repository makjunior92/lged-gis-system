# Production overrides — use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  db:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_ON_STARTUP: "true"
      SEED_RESET_DEMO_PASSWORDS: "false"
      SEED_IMPORT_BOUNDARIES: "true"
      UVICORN_RELOAD: ""
      UVICORN_WORKERS: "2"
    volumes: !reset []

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: /lged/
        NGINX_CONF: nginx.lged.conf
    ports:
      # Bind to localhost only — public traffic enters via host nginx (quantumflux.cloud/lged).
      - "127.0.0.1:3000:80"
