# Nginx config for the SPA container.
# - Serves the built React app from /usr/share/nginx/html
# - Falls back to index.html for client-side routing
# - Proxies /api/* to the backend service (resolved via Docker DNS as "backend")

upstream lged_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed Vite assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy. Keep timeouts reasonable; backend should respond fast.
    location /api/ {
        proxy_pass http://lged_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # SPA fallback: any unknown path serves index.html so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
